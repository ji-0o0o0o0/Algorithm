name: Move Codetree folders

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move-folders:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Move old folders to archive
        run: |
          mkdir -p codetree/trail1/archive
          shopt -s dotglob

          for dir in codetree/[0-9][0-9][0-9][0-9][0-9][0-9]/ ; do
            [ -d "$dir" ] || continue
            mv "$dir" codetree/trail1/archive/
          done

      - name: Commit changes
        run: |
          git config user.name "codetree-auto"
          git config user.email "codetree-auto@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "auto: archive codetree folders"
            git push origin main
          fi
