name: Move Codetree folders

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move-folders:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Move old folders to archive
        run: |
          mkdir -p trail1/archive
          shopt -s dotglob

          for dir in [0-9][0-9][0-9][0-9][0-9][0-9]/ ; do
            [ -d "$dir" ] || continue
            mv "$dir" trail1/archive/
          done

      - name: Commit changes
        run: |
          git config user.name "codetree-auto"
          git config user.email "codetree-auto@users.noreply.github.com"

          git add .
          git commit -m "auto: archive codetree folders" || echo "No changes"

          git push origin main
